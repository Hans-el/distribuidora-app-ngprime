<div class="min-h-screen flex items-center justify-center bg-surface-50 dark:bg-surface-950 px-4">
    <div class="card w-full max-w-md">
        <div class="flex flex-col gap-2 mb-6">
            <div class="font-semibold text-xl">Cambia tu contraseña</div>
            <div class="text-surface-600 dark:text-surface-300">
                Ingresaste con una contraseña temporal. Debes definir una propia para continuar.
            </div>
        </div>

        <div class="flex flex-col gap-4">
            <div>
                <label class="block font-medium mb-2">Contraseña temporal (actual)</label>
                <p-password [(ngModel)]="passwordActual" [feedback]="false" [toggleMask]="true" styleClass="w-full"
                    inputStyleClass="w-full" class="w-full" />
            </div>
            <div>
                <label class="block font-medium mb-2">Nueva contraseña</label>
                <p-password [(ngModel)]="passwordNueva" [feedback]="false" [toggleMask]="true" styleClass="w-full"
                    inputStyleClass="w-full" class="w-full" />
                <small class="text-surface-500">Mínimo 8 caracteres.</small>
            </div>
            <div>
                <label class="block font-medium mb-2">Confirmar nueva contraseña</label>
                <p-password [(ngModel)]="confirmacion" [feedback]="false" [toggleMask]="true" styleClass="w-full"
                    inputStyleClass="w-full" class="w-full" />
            </div>
        </div>

        @if (error()) {
        <div class="mt-4">
            <p-message severity="error" [text]="error()!" />
        </div>
        }

        <div class="flex justify-between mt-6 pt-6 border-t border-surface-200 dark:border-surface-700">
            <p-button label="Cerrar sesión" severity="secondary" [text]="true" (onClick)="salir()" />
            <p-button label="Guardar contraseña" icon="pi pi-check" [loading]="guardando()" [disabled]="guardando()"
                (onClick)="guardar()" />
        </div>
    </div>
</div>
