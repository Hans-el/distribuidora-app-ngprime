<app-floating-configurator />

<div
    class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-col items-center justify-center">
        <div class="rounded-[56px] p-[0.3rem]" style="
                background: linear-gradient(
                    180deg,
                    var(--primary-color) 10%,
                    rgba(33, 150, 243, 0) 30%
                );
            ">
            <div class="w-full bg-surface-0 dark:bg-surface-900 py-16 px-8 sm:px-20 rounded-[53px]">
                <div class="text-center mb-8">
                    <!-- Logo de verdezot -->
                    <img src="logo.png" alt="Logo de la distribuidora" class="mx-auto mb-6 w-24 h-24" />

                    <div class="text-surface-900 dark:text-surface-0 text-3xl font-medium mb-4">
                        Distribuidora & Ventas
                    </div>

                    <span class="text-muted-color font-medium">
                        Gestión de pedidos y control de ventas
                    </span>
                </div>

                @if (error()) {
                <p-message severity="error" [text]="error()!" styleClass="w-full mb-6" />
                }

                <form (ngSubmit)="login()">
                    <div class="mb-6">
                        <label for="username"
                            class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">
                            Usuario
                        </label>

                        <input pInputText id="username" name="username" type="text" placeholder="Ingrese su usuario"
                            class="w-full" [(ngModel)]="username" autocomplete="username" />
                    </div>

                    <div class="mb-6">
                        <label for="password"
                            class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">
                            Contraseña
                        </label>

                        <p-password id="password" name="password" [(ngModel)]="password"
                            placeholder="Ingrese su contraseña" [toggleMask]="true" [feedback]="false" [fluid]="true"
                            autocomplete="current-password" />
                    </div>

                    <p-button type="submit" label="Iniciar sesión" icon="pi pi-sign-in" styleClass="w-full"
                        [loading]="loading()" [disabled]="loading()" />
                </form>
            </div>
        </div>
    </div>
</div>
