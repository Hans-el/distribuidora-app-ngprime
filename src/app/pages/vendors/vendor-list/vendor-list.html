<div class="grid grid-cols-12 gap-8">
    <div class="col-span-12">

        <!-- Header -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
            <div>
                <h2 class="text-xl font-semibold text-surface-900 dark:text-surface-0">Vendedores</h2>
                <p class="text-surface-500 dark:text-surface-400 mt-1">Administra el equipo de ventas.</p>
            </div>
            <p-button label="Nuevo vendedor" icon="pi pi-plus" routerLink="/vendors/new" />
        </div>

        <div class="card">
            @if (error()) {
            <div class="mb-4">
                <p-message severity="error" [text]="error()!" />
            </div>
            }

            <p-table [value]="vendedores()" [loading]="loading()" [rowHover]="true" [showGridlines]="true"
                responsiveLayout="scroll" dataKey="id">
                <ng-template #header>
                    <tr>
                        <th>Nombre</th>
                        <th>Estado</th>
                        <th class="w-32">Acciones</th>
                    </tr>
                </ng-template>

                <ng-template #body let-vendedor>
                    <tr>
                        <td><span class="font-medium">{{ vendedor.nombre }}</span></td>
                        <td>
                            <p-tag [value]="vendedor.activo ? 'Activo' : 'Inactivo'"
                                [severity]="vendedor.activo ? 'success' : 'danger'" />
                        </td>
                        <td>
                            <div class="flex gap-1">
                                <p-button icon="pi pi-pencil" [text]="true" severity="secondary"
                                    [routerLink]="['/vendors', vendedor.id, 'edit']" pTooltip="Editar" />

                                <p-button [icon]="vendedor.activo ? 'pi pi-ban' : 'pi pi-check'" [text]="true"
                                    [severity]="vendedor.activo ? 'danger' : 'success'"
                                    (onClick)="toggleActivo(vendedor)"
                                    [pTooltip]="vendedor.activo ? 'Desactivar' : 'Activar'" />
                            </div>
                        </td>
                    </tr>
                </ng-template>

                <ng-template #emptymessage>
                    <tr>
                        <td colspan="3" class="text-center py-8 text-surface-500">No hay vendedores registrados.</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
